<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Área do garçom | LIV Beira</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--off:#faf7f0;--line:#e9e1cc;--gold:#a67c2c;--gold2:#d9bf7e;--ink:#26231f;--mut:#585044;--ok:#2f7a4b;--hd:'Playfair Display',Georgia,serif;--bd:'DM Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--off);color:var(--ink);font:400 16.5px/1.6 var(--bd);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--hd);font-weight:600;line-height:1.15;margin:0}p{margin:0}button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.top img{height:34px;width:auto}
.who{font-size:14px;color:var(--mut);text-align:right;line-height:1.3}.who b{display:block;color:var(--ink);font-size:15px}
.btn{display:inline-block;padding:13px 24px;border:1.5px solid var(--gold);color:var(--gold);font:600 15px var(--bd);letter-spacing:.04em;cursor:pointer;background:transparent;transition:.25s;text-align:center}
.btn:hover{background:var(--gold);color:#fff}.btn:disabled{opacity:.6;cursor:default}
.btn.g{background:linear-gradient(135deg,#c9a24d,#a67c2c 55%,#d6b866);color:#fff;border-color:transparent}.btn.g:hover{filter:brightness(1.08)}
.btn.s{padding:8px 14px;font-size:13.5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:13px 4px;border:0;border-bottom:3px solid transparent;background:none;font:600 17px var(--hd);color:var(--mut);cursor:pointer;position:relative}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;background:var(--gold);color:#fff;font:700 12px/22px var(--bd);text-align:center;border-radius:11px;vertical-align:2px}
main{padding:22px 0 80px}
.login{max-width:420px;margin:8vh auto 0;background:#fff;border:1px solid var(--gold2);border-top:3px solid var(--gold);padding:34px 28px;text-align:center}
.login img{height:50px;margin:0 auto 18px}.login h1{font-size:30px;margin-bottom:6px}.login p{color:var(--mut);margin-bottom:22px}
.login select,.login input{width:100%;padding:14px;border:1.5px solid var(--line);background:#fff;font-size:17px;margin-bottom:12px;border-radius:0;color:var(--ink)}
.login .btn{width:100%}.err{color:#a3361f;font-size:14.5px;min-height:20px;margin-bottom:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{padding:9px 15px;border:1.5px solid var(--gold2);background:#fff;font:500 14.5px var(--bd);color:var(--mut);cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.sp{flex:1}
.demo{background:#fff6dd;border:1px solid var(--gold2);padding:12px 16px;font-size:14.5px;color:var(--mut);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);padding:18px 20px;margin-bottom:14px}
.card.me{border-left-color:var(--ok)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.tag{font:700 12px var(--bd);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tm{font-size:13.5px;color:var(--mut);white-space:nowrap}.tm.late{color:#a3361f;font-weight:600}
.card h3{font-size:24px}.card .rs{font-weight:600;margin:4px 0}
.card ul{margin:8px 0;padding:0;list-style:none;border-top:1px solid var(--line)}.card li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.card .nt{color:var(--mut);font-size:15px;margin:8px 0;font-style:italic}
.card .tt{display:flex;justify-content:space-between;font-weight:600;margin:6px 0 12px}
.card .btn{width:100%}
.empty{text-align:center;color:var(--mut);padding:50px 10px;border:1px dashed var(--gold2);background:#fff}
.empty b{display:block;font:600 22px var(--hd);color:var(--ink);margin-bottom:4px}
.rk{background:#fff;border:1px solid var(--line)}
.rkh{padding:22px;text-align:center;border-bottom:2px solid var(--gold2);background:linear-gradient(145deg,#fffdf7,#f6edd5)}
.rkh small{font:600 12px var(--bd);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.rkh h2{font-size:34px;margin:6px 0 2px}.rkh p{color:var(--mut);font-size:15px}
.rw{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.rw:last-child{border:0}
.pos{width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--gold2);font:600 18px var(--hd);color:var(--mut)}
.rw.p1 .pos{background:var(--gold);color:#fff;border-color:var(--gold)}.rw.p2 .pos{background:#d9d4c7;border-color:#d9d4c7;color:var(--ink)}.rw.p3 .pos{background:#e3c08d;border-color:#e3c08d;color:var(--ink)}
.rw b{font-size:17px}.rw small{display:block;color:var(--mut);font-size:13.5px}
.bt{height:6px;background:var(--line);margin-top:6px}.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.ct{font:600 28px var(--hd);color:var(--gold);text-align:right;line-height:1}.ct small{font:500 12px var(--bd);color:var(--mut)}
.rw.mine{background:var(--off)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;font-size:15px;z-index:50;max-width:92vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="liv-api.js"></script>
<script>
(function(){
const C=LIV_CONFIG,A=LIV_API,SP=C.spaces,$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'\u00a0MT';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let me=store.get('liv_waiter'),tab='novos',filter='todos',period='hoje',calls=[],seen=null,sound=store.get('liv_sound')==='1',audio=null;
if(me&&!C.waiters.find(w=>w.name===me))me=null;
const app=$('#app');
const ago=iso=>{const m=Math.max(0,Math.floor((Date.now()-new Date(iso))/60000));return m<1?'agora mesmo':m<60?'há '+m+' min':'há '+Math.floor(m/60)+' h '+(m%60)+' min'};
const mins=iso=>Math.floor((Date.now()-new Date(iso))/60000);

function loginView(){
 app.innerHTML=`<div class="wrap"><div class="login"><img src="images/logo.png" alt="LIV Beira"><h1>Área do garçom</h1><p>Entre para aceitar chamados dos clientes.</p>
 <select id="ln" aria-label="O seu nome">${C.waiters.map(w=>`<option>${esc(w.name)}</option>`).join('')}</select>
 <input id="lp" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off" aria-label="PIN">
 <div class="err" id="le"></div><button class="btn g" id="lb">Entrar</button></div></div>`;
 const go=()=>{const w=C.waiters.find(x=>x.name===$('#ln').value);if(w&&w.pin===$('#lp').value.trim()){me=w.name;store.set('liv_waiter',me);start()}else{$('#le').textContent='PIN incorreto. Tente de novo.';$('#lp').value='';$('#lp').focus()}};
 $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
function shell(){
 const pend=calls.filter(c=>c.status==='pending').length,mine=calls.filter(c=>c.status==='accepted'&&c.waiter===me).length;
 app.innerHTML=`<header><div class="wrap"><div class="top"><img src="images/logo.png" alt="LIV Beira"><div style="display:flex;gap:12px;align-items:center"><div class="who">Garçom<b>${esc(me)}</b></div><button class="btn s" id="out">Sair</button></div></div>
 <div class="tabs" role="tablist"><button data-t="novos" class="${tab==='novos'?'on':''}">Novos${pend?`<span class="n">${pend}</span>`:''}</button><button data-t="meus" class="${tab==='meus'?'on':''}">Meus${mine?`<span class="n">${mine}</span>`:''}</button><button data-t="rank" class="${tab==='rank'?'on':''}">Ranking</button></div></div></header>
 <main><div class="wrap" id="mc"></div></main>`;
 $('#out').onclick=()=>{store.del('liv_waiter');me=null;seen=null;loginView()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
}
function itemsHtml(c){const it=c.items||[];if(!it.length)return'';const T=it.reduce((a,x)=>a+x.q*x.p,0);return`<ul>${it.map(x=>`<li><span>${x.q}× ${esc(x.n)}</span><span>${fmt(x.q*x.p)}</span></li>`).join('')}</ul><div class="tt"><span>Total estimado</span><span>${fmt(T)}</span></div>`}
function cardHtml(c,mode){
 const s=SP[c.space]?SP[c.space].name:c.space,late=mins(c.created_at)>=5;
 return`<div class="card ${mode==='mine'?'me':''}"><div class="ch"><span class="tag">${esc(s)}</span><span class="tm ${late&&mode==='new'?'late':''}">${ago(c.created_at)}</span></div>
 <h3>${esc(c.table_ref)}${c.client_name?' &bull; '+esc(c.client_name):''}</h3><div class="rs">${esc(c.reason)}</div>${itemsHtml(c)}${c.note?`<p class="nt">“${esc(c.note)}”</p>`:''}
 ${mode==='new'?`<button class="btn g" data-acc="${c.id}">Aceitar chamado</button>`:`<button class="btn g" data-fin="${c.id}">Concluir atendimento</button>`}</div>`;
}
function draw(){
 if(!me)return;
 if(!$('#mc')||!document.querySelector('.tabs'))shell();else{ // atualizar contadores
  const pend=calls.filter(c=>c.status==='pending').length,mine=calls.filter(c=>c.status==='accepted'&&c.waiter===me).length;
  document.querySelectorAll('.tabs button').forEach(b=>{const t=b.dataset.t;b.classList.toggle('on',t===tab);const n=t==='novos'?pend:t==='meus'?mine:0;if(t!=='rank')b.innerHTML=(t==='novos'?'Novos':'Meus')+(n?`<span class="n">${n}</span>`:'')});
 }
 const mc=$('#mc');let h='';
 if(!A.remote)h+='<div class="demo"><b>Modo de demonstração.</b> Os chamados só aparecem neste telemóvel/navegador. Ligue o Supabase em <code>config.js</code> para funcionar entre aparelhos (veja o LEIAME).</div>';
 if(tab==='novos'){
  const L=calls.filter(c=>c.status==='pending'&&(filter==='todos'||c.space===filter)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  h+=`<div class="bar">${['todos','palco','restaurante','lounge'].map(f=>`<button class="chip" data-f="${f}" aria-pressed="${filter===f}">${f==='todos'?'Todos':SP[f].name}</button>`).join('')}<span class="sp"></span><button class="chip" id="snd" aria-pressed="${sound}">${sound?'Som ligado':'Ativar som'}</button></div>`;
  h+=L.length?L.map(c=>cardHtml(c,'new')).join(''):'<div class="empty"><b>Sem chamados por agora</b>Quando um cliente chamar, aparece aqui com aviso.</div>';
 }else if(tab==='meus'){
  const L=calls.filter(c=>c.status==='accepted'&&c.waiter===me).sort((a,b)=>new Date(a.accepted_at)-new Date(b.accepted_at));
  h+=L.length?L.map(c=>cardHtml(c,'mine')).join(''):'<div class="empty"><b>Nenhum atendimento em curso</b>Os chamados que aceitar ficam aqui até os concluir.</div>';
 }else h+=rankHtml();
 mc.innerHTML=h;
}
function rankHtml(){
 const t0=new Date();t0.setHours(0,0,0,0);const lim=period==='hoje'?t0:period==='7d'?new Date(Date.now()-7*864e5):new Date(0);
 const m={};C.waiters.forEach(w=>m[w.name]={n:w.name,c:0,t:0,d:0});
 calls.filter(c=>c.waiter&&(c.status==='accepted'||c.status==='done')&&new Date(c.accepted_at||c.created_at)>=lim).forEach(c=>{const o=m[c.waiter]||(m[c.waiter]={n:c.waiter,c:0,t:0,d:0});o.c++;o.t+=Math.max(0,new Date(c.accepted_at)-new Date(c.created_at));if(c.status==='done')o.d++});
 const L=Object.values(m).sort((a,b)=>b.c-a.c||a.t/(a.c||1)-b.t/(b.c||1)),top=L[0]&&L[0].c?L[0]:null,mx=top?top.c:1;
 const lbl={hoje:'hoje','7d':'nos últimos 7 dias',tudo:'em todo o período'}[period];
 return`<div class="bar">${[['hoje','Hoje'],['7d','7 dias'],['tudo','Tudo']].map(p=>`<button class="chip" data-p="${p[0]}" aria-pressed="${period===p[0]}">${p[1]}</button>`).join('')}</div>
 <div class="rk"><div class="rkh"><small>Garçom em destaque</small><h2>${top?esc(top.n):'Ainda sem pedidos'}</h2><p>${top?top.c+' chamado'+(top.c>1?'s':'')+' aceite'+(top.c>1?'s':'')+' '+lbl:'Nenhum chamado aceite '+lbl}</p></div>
 ${L.map((w,i)=>{const av=w.c?Math.round(w.t/w.c/60000*10)/10:null;return`<div class="rw p${i+1} ${w.n===me?'mine':''}"><div class="pos">${i+1}</div><div><b>${esc(w.n)}${w.n===me?' (você)':''}</b><small>${w.d} concluído${w.d===1?'':'s'}${av!==null?' &bull; resposta média '+String(av).replace('.',',')+' min':''}</small><div class="bt"><i style="width:${Math.round(w.c/mx*100)}%"></i></div></div><div class="ct">${w.c}<br><small>aceites</small></div></div>`}).join('')}</div>`;
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3400)}
function beep(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();[0,.22].forEach((o,i)=>{const x=audio.createOscillator(),g=audio.createGain();x.type='sine';x.frequency.value=i?1046:784;g.gain.setValueAtTime(.0001,audio.currentTime+o);g.gain.exponentialRampToValueAtTime(.35,audio.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+o+.3);x.connect(g);g.connect(audio.destination);x.start(audio.currentTime+o);x.stop(audio.currentTime+o+.32)})}catch(e){}}
async function refresh(){
 if(!me)return;
 try{calls=await A.list();
  const ids=new Set(calls.filter(c=>c.status==='pending').map(c=>c.id));
  if(seen){let nw=0;ids.forEach(i=>{if(!seen.has(i))nw++});if(nw){if(sound)beep();if(navigator.vibrate)navigator.vibrate([250,120,250])}}
  seen=ids;draw()}catch(e){}
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t||!me)return;
 if(t.dataset.f){filter=t.dataset.f;return draw()}
 if(t.dataset.p){period=t.dataset.p;return draw()}
 if(t.id==='snd'){sound=!sound;store.set('liv_sound',sound?'1':'0');if(sound)beep();return draw()}
 if(t.dataset.acc){t.disabled=true;t.textContent='A aceitar…';let r=null;try{r=await A.accept(t.dataset.acc,me)}catch(x){toast('Sem ligação. Tente outra vez.');return refresh()}
  if(r){toast('Chamado aceite. Dirija-se ao cliente.');tab='meus'}else toast('Outro garçom já aceitou este chamado.');return refresh()}
 if(t.dataset.fin){t.disabled=true;t.textContent='A concluir…';try{await A.finish(t.dataset.fin,me);toast('Atendimento concluído.')}catch(x){toast('Sem ligação. Tente outra vez.')}return refresh()}
});
addEventListener('storage',e=>{if(e.key==='liv_calls_v1')refresh()});
setInterval(()=>{if(me)refresh()},3000);
function start(){seen=null;shell();draw();refresh()}
me?start():loginView();
})();
</script>
</body>
</html>
